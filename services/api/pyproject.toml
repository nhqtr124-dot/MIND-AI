[project]
name = "mind-api"
version = "0.1.0"
description = "MIND AI backend API, job worker and preview proxy"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pgvector>=0.3",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "email-validator>=2.2",
  "pyjwt>=2.9",
  "argon2-cffi>=23.1",
  "cryptography>=43",
  "python-multipart>=0.0.12",
  "redis>=5.0",
  "httpx>=0.27",
  "croniter>=3.0",
  "pillow>=10.4",
  "mind-ai-router",
  "mind-cad",
  "mind-docs",
  "mind-sandbox",
  "mind-research",
]

[project.optional-dependencies]
s3 = ["boto3>=1.35"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13", "boto3>=1.35"]

[project.scripts]
mind-api = "mind_api.cli:main"

[tool.uv.sources]
mind-ai-router = { workspace = true }
mind-cad = { workspace = true }
mind-docs = { workspace = true }
mind-sandbox = { workspace = true }
mind-research = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mind_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
