[project]
name = "mind-cad"
version = "0.1.0"
description = "MIND AI parametric CAD generation, export and mesh validation"
requires-python = ">=3.12"
dependencies = [
  "cadquery>=2.8,<3",
  "trimesh>=4.8",
  "numpy>=2.0",
  "manifold3d>=3.0",
  "rtree>=1.3",
  "networkx>=2.6",
  "lxml>=5.0",
  "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mind_cad"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]
