[project]
name = "mind-research"
version = "0.1.0"
description = "MIND AI web search adapters, safe page retrieval, evidence extraction and citation checks"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mind_research"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
