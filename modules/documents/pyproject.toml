[project]
name = "mind-docs"
version = "0.1.0"
description = "MIND AI document generation, extraction, conversion and validation"
requires-python = ">=3.12"
dependencies = [
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-pptx>=1.0",
  "reportlab>=4.2",
  "pymupdf>=1.24",
  "pycel>=1.0b30",
  "matplotlib>=3.9",
  "markdown-it-py>=3.0",
  "pydantic>=2.9",
  "arabic-reshaper>=3.0",
  "python-bidi>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mind_docs"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]
