[project]
name = "mind-ai-router"
version = "0.1.0"
description = "MIND AI provider adapters, model registry, routing and cost accounting"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mind_ai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
