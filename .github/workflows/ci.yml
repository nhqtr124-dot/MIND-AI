name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: mind_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      MIND_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/mind_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.13" }
      - name: System libraries (OpenCascade, fonts)
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglu1-mesa fonts-dejavu-core
      - run: uv sync --all-packages --frozen
      - name: Lint
        run: uv run ruff check modules services && uv run ruff format --check modules services
      - name: Sandbox images
        run: bash scripts/setup-sandbox.sh
      - name: Module tests
        run: |
          for d in modules/cad modules/documents modules/ai-router modules/sandbox modules/research; do
            (cd $d && uv run python -m pytest -q -p no:cacheprovider)
          done
      - name: API tests
        working-directory: services/api
        run: uv run python -m pytest -q -p no:cacheprovider

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm --filter @mind/api-client test
      - run: pnpm --filter @mind/web build
      - name: Mobile JS bundle compiles
        run: pnpm --filter @mind/mobile bundle:check
